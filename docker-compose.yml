version: "3.9"

services:

  db:
    image: postgres:15-alpine

    container_name: inventory_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./backend

    container_name: inventory_backend

    restart: always

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      - db


  frontend:
    build:
      context: ./frontend

    container_name: inventory_frontend

    restart: always

    ports:
      - "3000:80"

    depends_on:
      - backend


volumes:
  postgres_data: